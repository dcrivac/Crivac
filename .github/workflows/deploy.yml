name: Deploy to SiteGround

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare and add SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "No SSH_PRIVATE_KEY secret found" >&2
            exit 1
          fi

          # Write key to file preserving newlines
          printf '%s\n' "$SSH_PRIVATE_KEY" > deploy_key
          chmod 600 deploy_key

          # Normalize CRLF -> LF if present
          if grep -q $'\r' deploy_key 2>/dev/null || file deploy_key | grep -q CRLF; then
            echo "Converting CRLF -> LF in deploy_key"
            apt-get update -y && apt-get install -y dos2unix openssh-client || true
            dos2unix deploy_key || true
          fi

          # Start ssh-agent
          eval "$(ssh-agent -s)"

          # If a passphrase is provided in SSH_KEY_PASSPHRASE, try removing it (non-interactive)
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f deploy_key || true
          fi

          # Try to add key; if ssh-add fails with libcrypto errors, convert key format to PEM and retry
          TMPERR=/tmp/ssh-add.err
          if ! ssh-add deploy_key 2>"$TMPERR"; then
            echo "ssh-add failed, attempting conversion to PEM and retrying"
            # Convert to PEM (useful when key is in new OpenSSH format)
            ssh-keygen -p -P "${SSH_PASSPHRASE:-}" -N "" -m PEM -f deploy_key || true
            if ! ssh-add deploy_key 2>"$TMPERR"; then
              echo "ssh-add still failed; showing ssh-add output:" >&2
              sed -n '1,200p' "$TMPERR" >&2 || true
              exit 1
            fi
          fi
          rm -f "$TMPERR"

      - name: Ensure host is known
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Error: SSH_HOST secret is not set" >&2
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test SSH connection
        run: |
          set -euo pipefail
          PORT_OPT=""
          if [ -n "${{ secrets.SSH_PORT }}" ]; then
            PORT_OPT="-p ${{ secrets.SSH_PORT }}"
          fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 $PORT_OPT "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" 'echo SSH_CONNECTION_OK'

      - name: Run SFTP/SSH commands
        run: |
          sftp -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" <<'EOF'
          quit
          EOF
          
      - name: Deploy to SiteGround via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          local_path: ./dist/
          remote_path: ${{ secrets.REMOTE_PATH }}
          sftp_only: true
