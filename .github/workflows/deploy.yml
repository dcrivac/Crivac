name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare SSH key (write identity file, normalize)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "No SSH_PRIVATE_KEY secret found" >&2
            exit 1
          fi

          # Write key to file preserving newlines and strict permissions
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Normalize CRLF -> LF if present (install dos2unix only if needed)
          if grep -q $'\r' ~/.ssh/id_deploy 2>/dev/null || file ~/.ssh/id_deploy | grep -q CRLF; then
            echo "Converting CRLF -> LF in id_deploy"
            if ! command -v dos2unix >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y dos2unix openssh-client || true
            fi
            dos2unix ~/.ssh/id_deploy || true
          fi

          # If the key is in the new OpenSSH private-key format and later SSH fails,
          # we'll attempt conversion in-place during debugging steps (but avoid ssh-add).
          ls -l ~/.ssh/id_deploy

      - name: Ensure host is known
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${SSH_HOST:-}" ]; then
            echo "Error: SSH_HOST secret is not set" >&2
            exit 1
          fi

          PORT=${SSH_PORT:-22}
          if [ "$PORT" = "" ]; then PORT=22; fi

          # Use ssh-keyscan to fetch remote host keys. When using a non-standard port, format entries as [host]:port
          if [ "$PORT" = "22" ]; then
            ssh-keyscan -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            ssh-keyscan -p "$PORT" -t rsa,ecdsa,ed25519 "$SSH_HOST" 2>/dev/null | sed "s/^${SSH_HOST}/[${SSH_HOST}]:${PORT}/" >> ~/.ssh/known_hosts || true
          fi
          chmod 644 ~/.ssh/known_hosts || true

      - name: Debug SSH (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          echo "--- known_hosts ---"
          ls -l ~/.ssh || true
          sed -n '1,200p' ~/.ssh/known_hosts || true
          echo "--- ssh verbose connect ---"
          PORT_OPT=""
          if [ -n "${SSH_PORT:-}" ]; then
            PORT_OPT="-p ${SSH_PORT}"
          fi
          # Use the identity file directly to avoid ssh-agent/ssh-add issues
          ssh -vvv -i ~/.ssh/id_deploy -oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=10 $PORT_OPT "${SSH_USERNAME}@${SSH_HOST}" 'echo SSH_CONNECTION_OK' || true

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ]; then
            echo "Error: SSH_HOST secret is not set" >&2
            exit 1
          fi
          if [ -z "${SSH_USERNAME:-}" ]; then
            echo "Error: SSH_USERNAME secret is not set" >&2
            exit 1
          fi

          PORT_OPT=""
          if [ -n "${SSH_PORT:-}" ]; then
            PORT_OPT="-p ${SSH_PORT}"
          fi

          # Use the identity file directly
          ssh -i ~/.ssh/id_deploy -oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=10 $PORT_OPT "${SSH_USERNAME}@${SSH_HOST}" 'echo SSH_CONNECTION_OK'

      - name: Run SFTP/SSH commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail
          PORT_OPT=""
          if [ -n "${SSH_PORT:-}" ]; then
            # sftp doesn't accept -i on some versions; pass via -oIdentityFile
            PORT_OPT="-oPort=${SSH_PORT}"
          fi
          sftp -oIdentityFile=~/.ssh/id_deploy -oBatchMode=yes -oStrictHostKeyChecking=yes $PORT_OPT "${SSH_USERNAME}@${SSH_HOST}" <<'EOF'
          quit
          EOF

      - name: Deploy to SiteGround via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          local_path: ./dist/
          remote_path: ${{ secrets.REMOTE_PATH }}
          sftp_only: true
