name: Deploy to SiteGround

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare and add SSH key (remove passphrase if provided)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # Use SSH_PRIVATE_KEY secret only (standardized)
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          else
            echo "No SSH_PRIVATE_KEY secret found" >&2
            exit 1
          fi

          chmod 600 deploy_key

          # If a passphrase is stored in SSH_KEY_PASSPHRASE, remove it so ssh-add won't prompt.
          if [ -n "${{ secrets.SSH_KEY_PASSPHRASE }}" ]; then
            ssh-keygen -p -P "${{ secrets.SSH_KEY_PASSPHRASE }}" -N "" -f deploy_key
          fi

          eval "$(ssh-agent -s)"
          ssh-add deploy_key

      - name: Ensure host is known
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Error: SSH_HOST secret is not set" >&2
            exit 1
          fi
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Run SFTP/SSH commands
        run: |
          sftp -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" <<'EOF'
          quit
          EOF
          
      - name: Deploy to SiteGround via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          local_path: ./dist/
          remote_path: ${{ secrets.REMOTE_PATH }}
          sftp_only: true
